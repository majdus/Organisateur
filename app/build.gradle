plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
}

// Coordonnées de la clé de téléversement. Le fichier est ignoré par Git (il porte les mots de
// passe en clair) et n'existe donc que sur les postes autorisés à signer. Voir
// `keystore.properties.example` pour le modèle à recopier.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    // Le nom de paquet vit ici depuis AGP 8 ; l'attribut `package` du manifeste est supprimé.
    namespace 'com.majdus.organisateur'
    compileSdk 36

    defaultConfig {
        applicationId "com.majdus.organisateur"
        minSdk 28
        targetSdk 36
        // Aligné sur le tag Git. versionCode dérivé du nom de version
        // (majeure * 10000 + mineure * 100 + correctif), afin qu'il reste croissant
        // et lisible: 2.1.0 -> 20100.
        versionCode 20601
        versionName "2.6.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Signé seulement là où la clé est disponible. Ailleurs la compilation aboutit quand
            // même, sur un APK non signé: c'est ce qui permet de construire sans les secrets.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildToolsVersion '36.0.0'
}

// Le schéma Room est exporté et versionné depuis la version 8: c'est la référence qui permet
// d'écrire les migrations suivantes et de voir en revue ce qu'une évolution change vraiment.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Material 1.12 gère les encarts système dans les BottomSheetDialog, où se fait toute
    // l'édition de l'application: sans lui, les feuilles passent sous la barre de navigation.
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Le balayage d'une période à l'autre, avec le recyclage des pages: c'est ce qui évite
    // d'avoir à réécrire un défilement horizontal à la main dans les grilles de l'agenda.
    //
    // Volontairement en 1.0.0, la version que Material 1.12 amène déjà: l'ajouter ne coûte donc
    // rien. La 1.1.0 tire une cascade de mises à jour d'AndroidX qui gonfle l'APK de 11 Mo, pour
    // des correctifs dont rien ici ne dépend.
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // Room
    def room_version = "2.7.1"
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    
    // Coroutines & Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"

    testImplementation 'junit:junit:4.+'
    // `org.json` n'est qu'une coquille vide dans le android.jar des tests unitaires: la vraie
    // implémentation permet de vérifier sur la machine de développement que ce qu'on répare
    // d'un JSON tronqué se relit bien.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}